name: CI

# Actions 분 절약: 문서만 바뀐 푸시는 건너뛰고, 같은 브랜치의 이전 실행은 취소한다.
# E2E(브라우저 설치 포함, 가장 비쌈)는 PR과 수동 실행에서만 돈다.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/bg
          key: bg-${{ hashFiles('scripts/bg-models-*.json') }}
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run audit:content

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: |
            dist
            !dist/bg
          retention-days: 7

  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/bg
          key: bg-${{ hashFiles('scripts/bg-models-*.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:pwa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
