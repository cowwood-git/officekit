name: Visual regression

on:
  workflow_dispatch:

jobs:
  visual:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7
